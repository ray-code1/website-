    <head>
        <style>
            div{
                height:200px;
                width:200px;
                background-color: azure;

                animation-name: Ray;
                animation-duration: 4s;
            }
            
            @keyframes Ray {

0% {background-color: red;}

25% {background-color: yellow;}

50% {background-color: blue;}

100% {background-color: green;}

}
            

        </style>
    </head>
    <body>
        <div>
            hello
        </div>
    </body>
</html>
